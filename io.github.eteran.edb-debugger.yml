app-id: io.github.eteran.edb-debugger
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: edb
rename-icon: edb
rename-desktop-file: edb.desktop
rename-appdata-file: edb.appdata.xml
finish-args:
  - --allow=devel
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=xdg-documents
  - --device=dri
cleanup:
  - /include
  - '*.la'
  - '*.a'
  
modules:
  - name: capstone
    buildsystem: simple
    build-commands:
      - make V=1
      - make PREFIX=/app/ install
    sources:
      - type: git
        url: https://github.com/aquynh/capstone.git
        tag: "5.0.9"
        commit: 022575848782a4801fd150fdbc927effcbca0864
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
          
  - name: yasm
    buildsystem: autotools
    build-options:
      env:
        ac_cv_header_stdc: "yes"
        CFLAGS: "-std=gnu17"
    sources:
      - type: git
        url: https://github.com/yasm/yasm.git
        tag: v1.3.0
        commit: ba463d3c26c0ece2e797b8d6381b161633b5971a

  - name: graphviz
    buildsystem: autotools
    sources:
      - type: archive
        url: https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/10.0.1/graphviz-10.0.1.tar.gz
        sha256: 72e1a575e9c382c4fd2267837962bc4582b3d9ad746e338cd8024bdeca124f32
        
  - name: libXmu #xterm
    buildsystem: autotools
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/xorg/lib/libxmu.git
        tag: "libXmu-1.2.1"
        commit: 792f80402ee06ce69bca3a8f2a84295999c3a170

  - name: libXaw #xterm
    buildsystem: autotools
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/xorg/lib/libxaw.git
        tag: "libXaw-1.0.16"
        commit: f14ba54e9c7e415a05e33dd0b3b5f96e5de05c8b

  - name: xterm
    buildsystem: autotools
    config-opts:
      - --disable-full-tgetent
    sources:
      - type: archive
        url: https://invisible-island.net/archives/xterm/xterm-403.tgz
        sha256: 1331b0df5919cb243ffe326dc6ff10a291e683a262f70cdf964a664be733ad83
        
  - name: tllist #fcft
    buildsystem: meson
    sources:
      - type: git
        url: https://codeberg.org/dnkl/tllist.git
        tag: 1.1.0

  - name: fcft #foot
    buildsystem: meson
    sources:
      - type: git
        url: https://codeberg.org/dnkl/fcft.git
        tag: 3.3.3

  - name: foot
    buildsystem: meson
    config-opts:
      - -Ddocs=disabled
      - -Dterminfo=disabled
    sources:
      - type: git
        url: https://codeberg.org/dnkl/foot.git
        tag: 1.28.0

  - name: edb
    buildsystem: cmake-ninja
    post-install:
      - install -Dm644 edb.appdata.xml /app/share/appdata/edb.appdata.xml
      - install -Dm644 src/res/images/edb.svg /app/share/icons/hicolor/scalable/apps/edb.svg
    sources:
      - type: git
        url: https://github.com/eteran/edb-debugger.git
        tag: 1.6.2
        commit: 4b8be8652ad14814b9f3bef8badb6623ea604df6
        x-checker-data:
          type: git
          is-main-source: true
          tag-pattern: ^([\d.]+)$

