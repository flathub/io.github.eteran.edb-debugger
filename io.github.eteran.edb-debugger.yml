app-id: io.github.eteran.edb-debugger
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: edb
rename-icon: edb
rename-desktop-file: edb.desktop
rename-appdata-file: edb.appdata.xml
finish-args:
  - --allow=devel
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=xdg-documents
  - --device=dri

modules:
  - name: capstone
    buildsystem: simple
    build-commands:
      - make V=1
      - make PREFIX=/app/ install
    sources:
      - type: git
        url: https://github.com/aquynh/capstone.git
        tag: "5.0.9"
        commit: 022575848782a4801fd150fdbc927effcbca0864
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

  - name: graphviz
    buildsystem: autotools
    sources:
      - type: archive
        url: https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/10.0.1/graphviz-10.0.1.tar.gz
        sha256: 72e1a575e9c382c4fd2267837962bc4582b3d9ad746e338cd8024bdeca124f32

  - name: edb
    buildsystem: cmake-ninja
    post-install:
      - install -Dm644 nedb.appdata.xml /app/share/appdata/edb.appdata.xml
      - install -Dm644 src/res/images/edb.svg /app/share/icons/hicolor/scalable/apps/edb.svg
    sources:
      - type: git
        url: https://github.com/eteran/edb-debugger.git
        tag: 1.6.0
        commit: 0210ca6f711bd26139cd7a703d2718d90f5752d9
        x-checker-data:
          type: git
          is-main-source: true
          tag-pattern: ^([\d.]+)$
      - type: file
        path: nedb.appdata.xml

